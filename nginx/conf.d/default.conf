# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=5r/s;

# Block suspicious user agents
map $http_user_agent $bad_bot {
    default 0;
    ~*bot 1;
    ~*spider 1;
    ~*crawler 1;
    ~*scan 1;
    ~*exploit 1;
}

# Block known malicious IPs
geo $bad_client {
    default 0;
    # Block the specific malicious IP
    34.63.101.71 1;
    # Block Google Cloud IP range (since the attack came from there)
    34.0.0.0/8 1;
}

server {
    listen 443 ssl;
    server_name offers.handsomehomebuyer.com;

    # Block known malicious IPs
    if ($bad_client) {
        return 444;
    }

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';";

    # Block bad bots
    if ($bad_bot) {
        return 403;
    }

    # Block suspicious requests
    if ($request_uri ~* "\.(php|asp|aspx|jsp|cgi)$") {
        return 403;
    }

    # Block path traversal attempts
    if ($request_uri ~* "\.\./|\.\.\\|\.\.%2f|\.\.%5c") {
        return 403;
    }

    # Increase maximum upload file size (set to 5000MB)
    client_max_body_size 5000M;

    # Increase timeouts for large file uploads
    client_body_timeout 300s;
    client_header_timeout 120s;
    keepalive_timeout 300s;
    send_timeout 300s;

    # Buffer settings for large file handling
    client_body_buffer_size 128k;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_temp_file_write_size 64k;

    # Block requests that do not come from your domain
    valid_referers none blocked server_names
                   *.handsomehomebuyer.com handsomehomebuyer.com;

    if ($invalid_referer) {
        return 403;
    }

    # Proxy settings for API
    location /api {
        # Apply rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Additional settings for large file uploads
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
    }

    # Static files
    location / {
        # Apply rate limiting
        limit_req zone=general_limit burst=10 nodelay;
        
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name offers.handsomehomebuyer.com;

    # Block known malicious IPs
    if ($bad_client) {
        return 444;
    }

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}